<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15202c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Magazzino">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Magazzino Motori e Gomme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: scheda d'officina — barra con due reparti (motori+turbo, gomme), righe a cartellino con barre d'usura in km */
:root{
  --bg:#eceff2; --surface:#ffffff; --sunk:#f5f7f9; --ink:#15202c; --muted:#5a6776; --line:#d3d9e0;
  --accent:#1f6fb2; --accent-ink:#ffffff; --pair:#e6eef7;
  --ok:#2c8a4b; --ok-soft:#e1f2e6; --warn:#b97c00; --warn-soft:#fbf0d4; --bad:#c42a2a; --bad-soft:#fbe1e1;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px; --logo:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#17202a; --sunk:#121a22; --ink:#e5eaf0; --muted:#93a0af; --line:#2a3644;
  --accent:#5aa7ea; --accent-ink:#06121e; --pair:#1b2a3a;
  --ok:#52c27f; --ok-soft:#173023; --warn:#efb64a; --warn-soft:#352a12; --bad:#ff6d6d; --bad-soft:#3a1a1c; --logo:invert(1); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#17202a; --sunk:#121a22; --ink:#e5eaf0; --muted:#93a0af; --line:#2a3644;
  --accent:#5aa7ea; --accent-ink:#06121e; --pair:#1b2a3a;
  --ok:#52c27f; --ok-soft:#173023; --warn:#efb64a; --warn-soft:#352a12; --bad:#ff6d6d; --bad-soft:#3a1a1c; --logo:invert(1); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1560px;margin:0 auto;padding-inline:16px}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hbar{display:flex;align-items:center;gap:14px;padding-block:8px}
.logos{display:flex;align-items:center;gap:10px;flex:none}
.logos img{height:34px;width:auto;filter:var(--logo);display:block}
.logos img.f4{height:24px}
.ttl{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase;margin:0;line-height:1;white-space:nowrap}
.ttl b{color:var(--accent)}
.seg{display:flex;flex:1 1 auto;max-width:420px;margin-left:auto;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;min-width:0}
.seg button{flex:1 1 0;min-width:0;font:600 16px var(--f-display);letter-spacing:.04em;text-transform:uppercase;background:none;border:0;border-radius:7px;color:var(--muted);padding:9px 8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.gear{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.ls{display:none}
.langb{font:700 15px var(--f-display);letter-spacing:.04em;color:var(--ink)}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.langs .btn{min-height:56px;font-size:17px;justify-content:center}
.langs .btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.gear[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#status{display:block;color:var(--muted);font-size:12px;padding-bottom:6px}
#status.ok,#status:empty{display:none}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:20px 60px;display:grid;gap:18px}
section.grp{display:grid;gap:10px;padding-top:6px}
.banner{background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r);padding:10px 14px;font-size:13px}
h2.sec{font:700 20px var(--f-display);letter-spacing:.05em;text-transform:uppercase;margin:0}
h3.sub{font:700 16px var(--f-display);letter-spacing:.06em;text-transform:uppercase;margin:0}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.btn{font:500 13px var(--f-body);border-radius:5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.link{border:0;background:none;color:var(--muted);padding:4px 6px;text-decoration:underline;text-underline-offset:2px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:grid;gap:2px}
.kpi .n{font:700 30px var(--f-display);line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi.bad .n{color:var(--bad)} .kpi.warn .n{color:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.plain::before{display:none}
.list{display:grid}
.row{display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,1.5fr) minmax(0,1.5fr) 440px;gap:10px 20px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);position:relative}
.row.solo{grid-template-columns:minmax(150px,1fr) minmax(0,3fr) 440px}
.row:first-child{border-top:0}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.row.lvl-bad::before{background:var(--bad)} .row.lvl-warn::before{background:var(--warn)}
.name{font-weight:600;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.name .sn{font:500 15px var(--f-mono);white-space:nowrap}
.kind{font:700 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.subl{color:var(--muted);font-size:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.side{display:grid;gap:8px;justify-items:end}
.bars{display:grid;gap:5px;min-width:0}
.pairbox{background:var(--pair);border-radius:5px;padding:8px 10px;display:grid;gap:5px;min-width:0}
.pairbox .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.bline{display:grid;grid-template-columns:68px minmax(60px,1fr) auto;gap:8px;align-items:center;font-size:12px}
.bline .bl{color:var(--muted)}
.bar{height:7px;background:var(--sunk);border:1px solid var(--line);border-radius:4px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ok)}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.bar .mark{position:absolute;top:0;bottom:0;width:1px;background:var(--muted);opacity:.6}
.bv{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tot{font-size:12px;color:var(--muted)} .tot b{color:var(--ink);font:500 13px var(--f-mono)}
.muted{color:var(--muted)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty strong{color:var(--ink);font-size:15px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input,textarea{font:16px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:7px 9px;width:100%}
.filters select{width:auto}
textarea{min-height:110px;font-family:var(--f-mono);font-size:12px}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
tr:first-child td{border-top:0}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.nw,td.nw b{white-space:nowrap}
.evs{font-size:12px;line-height:1.5;min-width:190px}
.evs b{font-weight:500}
.hit{background:var(--warn-soft);border-radius:3px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.grid2 .full{grid-column:1/-1}
.fld{display:grid;gap:4px}
.fld label{font-size:12px;color:var(--muted);font-weight:500}
.fld .hint{font-size:11px;color:var(--muted)}
.fld.check{display:flex;gap:8px;align-items:center}
.fld.check input{width:auto}
.tgrp{display:grid;gap:8px}
.tgrp h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tgrp h3 small{font:500 13px var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted)}
.tlist{display:grid;gap:8px}
.tcard{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;color:var(--ink);font:inherit;cursor:pointer;min-height:64px}
.tcard:active{transform:scale(.99)}
.tcard .tcode{font:700 24px var(--f-display);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .tkm{font:500 15px var(--f-mono);color:var(--muted);white-space:nowrap}
.tcard .tkm b{font:600 22px var(--f-mono);color:var(--ink)}
.tst{font:700 13px var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:6px 10px;border-radius:999px;white-space:nowrap}
.tst.ok{background:var(--ok-soft);color:var(--ok)}
.tst.x{background:var(--bad-soft);color:var(--bad);min-width:40px;text-align:center;font-size:16px}
.tcard.x{background:var(--sunk)}
.tcard.x .tcode,.tcard.x .tkm b{color:var(--muted)}
.det{display:grid;gap:14px}
.det .big{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.det .big .tcode{font:700 34px var(--f-display);letter-spacing:.04em}
.det .kmbig{font:600 28px var(--f-mono)}
.fia{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fia div{background:var(--sunk);border-radius:6px;padding:8px 10px;display:grid;gap:2px}
.fia span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fia b{font:500 15px var(--f-mono);overflow-wrap:anywhere}
.sep{grid-column:1/-1;font:700 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
#modal{position:fixed;inset:0;background:rgba(10,15,20,.55);z-index:50;display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:min(580px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:18px;display:grid;gap:14px}
.sheet h3{font:700 20px var(--f-display);letter-spacing:.04em;text-transform:uppercase;margin:0}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.acts .grow{margin-right:auto}
.ferr{color:var(--bad);font-size:13px;margin:0}
.log{display:grid;font-size:13px}
.log div{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.log div:first-child{border-top:0}
#fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:none;align-items:center;gap:8px;border:0;border-radius:999px;padding:0 22px 0 18px;height:56px;background:var(--accent);color:var(--accent-ink);font:600 17px var(--f-body);box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}
#fab .pl{font-size:28px;line-height:1;font-weight:400;margin-top:-2px}
#fab:active{transform:scale(.97)}
.choice{display:grid;gap:10px}
.choice .btn{min-height:56px;font-size:18px;justify-content:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:6px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}
@media (max-width:370px){
  .logos img.f4{display:none}
}
@media (max-width:1100px){
  .ttl{display:none}
}
@media (max-width:900px){
  .sechead:has(> h2.sec){display:none}
  .inl{display:none!important}
  #fab:not([hidden]){display:inline-flex}
  #main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  #toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  body{font-size:16px}
  .btn,.btn.sm{min-height:42px;padding:9px 14px;font-size:15px}
  .btn.link{min-height:0}
  .hbar{gap:8px;padding-block:6px}
  .gear{width:40px;height:40px}
  .langb{width:36px}
  .lf{display:none}
  .ls{display:inline}
  .ttl{display:none}
  .logos{gap:6px}
  .logos img{height:30px} .logos img.f4{height:17px}
  .seg{max-width:none}
  .seg button{font-size:15px;padding:6px 4px;letter-spacing:.01em;white-space:normal;line-height:1.05;min-height:40px;text-overflow:clip}
  #modal{place-items:end center;padding:0}
  .sheet{width:100%;border-radius:14px 14px 0 0;max-height:85vh;max-height:85dvh;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
  .acts .btn{flex:1 1 auto}
  .tcard .tcode{font-size:22px}
  .row,.row.solo{grid-template-columns:minmax(0,1fr)}
  .side{justify-items:start}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .kpi:last-child:nth-child(odd){grid-column:1/-1}
}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}
@media (display-mode: standalone){header.top{padding-top:env(safe-area-inset-top,0px)}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap hbar" id="tabs">
    <div class="logos"><img src="logo-squadra.png" alt="Logo squadra"><img class="f4" src="logo-f4.png" alt="F4"></div>
    <h1 class="ttl" data-notr>Magazzino <b>Motori</b> e Gomme</h1>
    <nav class="seg" aria-label="Reparti">
      <button data-tab="motori"><span class="lf">Motori e turbo</span><span class="ls">Motori</span></button>
      <button data-tab="gomme">Gomme</button>
    </nav>
    <button class="gear langb" id="langBtn" type="button" aria-label="Lingua" title="Lingua">IT</button>
    <button class="gear" data-tab="impostazioni" aria-label="Impostazioni" title="Impostazioni"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <div class="wrap"><span class="meta" id="status">Connessione…</span></div>
</header>
<main class="wrap" id="main">
  <div class="panel empty"><strong>Caricamento del magazzino</strong><span>Motori, turbo e gomme compariranno qui.</span></div>
</main>
<button id="fab" type="button" hidden><span class="pl" aria-hidden="true">+</span><span id="fabTxt">Nuovo</span></button>
<div id="modal" hidden></div>
<div id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(typeof v==='string')v=v.trim().replace(/\.(?=\d{3}\b)/g,'').replace(',','.');const n=Number(v);return isFinite(n)?n:0};
const fmt=n=>num(n).toLocaleString('it-IT',{maximumFractionDigits:1});
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const dIt=s=>s?s.split('-').reverse().join('/'):'—';
const norm=s=>String(s||'').trim().toLowerCase();
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

const DEF={engRevKm:5000,engLifeKm:8000,turPerfKm:4000,turLifeKm:5000,warnPct:80,pilots:[]};
const TSTAT={disponibile:'Disponibile',scartato:'Scartato'};
const S={eng:[],tur:[],tires:[],cfg:{...DEF},db:null,ro:false,live:false,
  tab:['motori','gomme','impostazioni'].includes(store.get('mg_tab'))?store.get('mg_tab'):'motori',
  showOld:false,pil:store.get('mg_pil'),fTire:'tutti',q:''};
const NONE='__none';
const WHEELS=[['fiaFL','Ant. sx'],['fiaFR','Ant. dx'],['fiaRL','Post. sx'],['fiaRR','Post. dx']];
const ESTAT={disponibile:'Disponibile',revisione:'In revisione',scartato:'Scartato'};

/* ---------- km ---------- */
const evs=x=>Array.isArray(x&&x.events)?x.events:[];
const kmTot=x=>num(x.kmStart)+evs(x).reduce((a,e)=>a+num(e.km),0);
const kmRev=x=>Math.max(0,kmTot(x)-num(x.revAt));
const engById=id=>S.eng.find(x=>x.id===id);
const turById=id=>S.tur.find(x=>x.id===id);
const engOfTurbo=t=>S.eng.find(e=>e.turboId===t.id);
function health(x,kind){
  const c=S.cfg,w=num(c.warnPct||80)/100;
  let lvl='ok';const why=[];const up=(l,s)=>{if(l==='bad'||(l==='warn'&&lvl==='ok'))lvl=l;why.push({l,s})};
  let L;
  if(kind==='tur'){
    const tot=kmTot(x),perf=num(c.turPerfKm),life=num(c.turLifeKm);
    L=[{k:'perf',lab:'Performance',val:tot,max:perf,soft:true},{k:'life',lab:'Cambio',val:tot,max:life}].filter(m=>m.max>0).map(m=>({...m,p:m.val/m.max}));
    if(life&&tot>=life)up('bad','Da cambiare: +'+fmt(tot-life)+' km');
    else if(perf&&tot>=perf)up('warn','Oltre performance · cambio tra '+fmt(life-tot)+' km');
  }else{
    L=[{k:'rev',lab:'Revisione',val:kmRev(x),max:num(c.engRevKm)},{k:'life',lab:'Vita',val:kmTot(x),max:num(c.engLifeKm)}].filter(m=>m.max>0).map(m=>({...m,p:m.val/m.max}));
    for(const m of L){const rem=m.max-m.val;
      if(m.p>=1)up('bad',m.k==='rev'?'Revisione superata di '+fmt(-rem)+' km':'Vita superata di '+fmt(-rem)+' km');
      else if(m.p>=w)up('warn',m.k==='rev'?'Revisione tra '+fmt(rem)+' km':'Fine vita tra '+fmt(rem)+' km')}
  }
  if(!L.length)lvl='na';
  why.sort((a,b)=>(b.l==='bad')-(a.l==='bad'));
  return{lvl,L,why,maxP:L.reduce((a,m)=>Math.max(a,m.p),0)};
}

}

const LI={it:0,en:1,pl:2,lv:3};
const NUM=/\d+(?:[.,]\d+)*/g;
const TX={},TP=[];
for(const r of TR){if(r[0].includes('{}'))TP.push({re:new RegExp('^'+r[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\\\{\\\}/g,'(.+?)').replace(/#/g,'(\\d+(?:[.,]\\d+)*)')+'$'),r});else TX[r[0]]=r}
let LANG='it';try{LANG=localStorage.getItem('mg_lang')||'it'}catch(e){}
if(!(LANG in LI))LANG='it';
const fill=(t,v)=>t.replace(/\{(\d)\}/g,(_,i)=>v[i-1]??'');
function trCore(s){
  if(LANG==='it'||!s)return s;const i=LI[LANG];
  let r=TX[s];if(r)return r[i];
  const nums=s.match(NUM);
  if(nums){r=TX[s.replace(NUM,'#')];if(r)return fill(r[i],nums)}
  for(const p of TP){const m=s.match(p.re);if(m)return fill(p.r[i],m.slice(1))}
  return null;
}
function tr(s){
  if(LANG==='it'||s==null)return s;
  const m=String(s).match(/^(\s*)([\s\S]*?)(\s*\*?\s*)$/);const core=m[2];
  const t=trCore(core);return t==null?s:m[1]+t+m[3];
}
const ORIG=new WeakMap();
function trTree(root){
  if(!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while(n=w.nextNode()){const p=n.parentElement;if(!p||p.closest('script,style,textarea,[data-notr]'))continue;
    if(!ORIG.has(n))ORIG.set(n,n.nodeValue);const o=ORIG.get(n);const t=LANG==='it'?o:tr(o);if(n.nodeValue!==t)n.nodeValue=t}
  const els=root.querySelectorAll?root.querySelectorAll('[placeholder],[aria-label],[title]'):[];
  for(const e of [root.nodeType===1?root:null,...els]){if(!e||!e.getAttribute||e.closest('[data-notr]'))continue;
    for(const a of ['placeholder','aria-label','title']){const v=e.getAttribute(a);if(v==null)continue;
      const k='data-o-'+a;if(!e.hasAttribute(k))e.setAttribute(k,v);const o=e.getAttribute(k);const t=LANG==='it'?o:tr(o);if(v!==t)e.setAttribute(a,t)}}
}
const trObs=new MutationObserver(recs=>{
  for(const r of recs){if(r.type==='characterData'){const n=r.target;ORIG.set(n,n.nodeValue);if(n.parentElement)trTree(n.parentElement)}
    else r.addedNodes.forEach(n=>{if(n.nodeType===3){ORIG.delete(n);if(n.parentElement)trTree(n.parentElement)}else if(n.nodeType===1)trTree(n)})}
  trObs.takeRecords();
});

function fieldHtml(f){
  if(f.type==='sep')return `<div class="sep">${esc(f.label)}</div>`;
  const id='f_'+f.id,v=f.value??'';
  if(f.type==='check')return `<div class="fld check${f.full?' full':''}"><input id="${id}" name="${f.id}" type="checkbox"${v?' checked':''}><label for="${id}">${esc(f.label)}</label></div>`;
  const lab=`<label for="${id}">${esc(f.label)}${f.required?' *':''}</label>`;
  let ctl;
  if(f.type==='select')ctl=`<select id="${id}" name="${f.id}">${f.options.map(o=>`<option value="${esc(o.v)}"${String(o.v)===String(v)?' selected':''}>${esc(o.l)}</option>`).join('')}</select>`;
  else if(f.type==='textarea')ctl=`<textarea id="${id}" name="${f.id}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
  else ctl=`<input id="${id}" name="${f.id}" type="${f.type||'text'}" value="${esc(v)}"${f.type==='number'?' inputmode="decimal" step="any" min="0"':''}${f.scan?' data-scan="1"':''}${f.list?` list="${id}_l"`:''} placeholder="${esc(f.ph||'')}" autocomplete="off">${f.list?`<datalist id="${id}_l">${f.list.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`:''}`;
  return `<div class="fld${f.full?' full':''}">${lab}${ctl}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</div>`;
}
function openForm({title,intro,fields,submit='Salva',onSubmit,danger}){
  const m=$('#modal');
  m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">${esc(title)}</h3>${intro?`<p class="muted" style="margin:0">${intro}</p>`:''}<form id="mf" novalidate><div class="grid2">${fields.map(fieldHtml).join('')}</div><p class="ferr" id="ferr" hidden></p><div class="acts" style="margin-top:14px">${danger?`<button type="button" class="btn danger grow" id="mdanger">${esc(danger.label)}</button>`:''}<button type="button" class="btn" data-close>Annulla</button><button class="btn primary" type="submit">${esc(submit)}</button></div></form></div>`;
  m.hidden=false;
  const first=m.querySelector('input,select,textarea');first&&first.focus();
  const form=$('#mf');
  /* lettore di codici a barre: Invio passa al campo successivo invece di salvare */
  const scans=[...form.querySelectorAll('[data-scan]')];
  scans.forEach((el,i)=>el.addEventListener('keydown',e=>{if(e.key!=='Enter')return;e.preventDefault();const n=scans[i+1];if(n){n.focus();n.select()}else el.blur()}));
  if(danger)$('#mdanger').onclick=()=>{closeModal();danger.run()};
  form.onsubmit=async e=>{
    e.preventDefault();const v={};
    fields.forEach(f=>{if(f.type==='sep')return;const el=form.elements[f.id];if(!el)return;v[f.id]=f.type==='check'?el.checked:el.value.trim()});
    const miss=fields.find(f=>f.required&&!v[f.id]);const er=$('#ferr');
    if(miss){er.textContent='Compila il campo "'+miss.label+'".';er.hidden=false;return}
    const btn=form.querySelector('[type=submit]');btn.disabled=true;
    try{await onSubmit(v);closeModal()}catch(x){er.textContent=x.message||'Salvataggio non riuscito. Riprova.';er.hidden=false;btn.disabled=false}
  };
  return form;
}

}

    onSubmit:v=>run(async()=>{

function parseEvents(txt){return String(txt||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(.*?)[\s;:\t,]+(\d+(?:[.,]\d+)?)\s*(km)?$/i);return m?{ev:m[1].trim(),km:num(m[2])}:{ev:l,km:0}})}
function parseEvents3(txt){return String(txt||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split(/\s*[;|\t]\s*/);if(p.length>=3)return{ev:p[0],pilot:p.slice(1,-1).join(' '),km:num(p[p.length-1])};const r=parseEvents(l)[0];return{...r,pilot:''}})}

  if(!S.tires.length)return `<div class="panel empty"><strong>Nessun set di gomme</strong><span>Aggiungi il primo set con «Nuovo set».</span></div>`;
  const grp=(name,arr)=>{const all=arr.filter(match).sort(sort),inM=all.filter(x=>!x.trash).length;
    return `<section class="tgrp"><h3 class="sub">${name}<small>${inM} in magazzino · ${all.length-inM} X</small></h3>${all.length?`<div class="tlist">${all.map(tireCard).join('')}</div>`:`<div class="panel empty" style="padding:16px"><span>${q?'Nessun set trovato.':'Nessun set '+name.toLowerCase()+'.'}</span></div>`}</section>`};

}
function tireForm(x){
  openForm({title:x?'Modifica set '+x.label:'Nuovo set gomme',fields:[
    {id:'label',label:'Codice set',value:x?.label,required:true,ph:'BCN-09'},
    {id:'compound',label:'Tipo',type:'select',options:[{v:'Slick',l:'Slick'},{v:'Wet',l:'Wet'}],value:x&&isWet(x)?'Wet':'Slick'},
    {id:'status',label:'Stato',type:'select',full:true,options:[{v:'mag',l:'In magazzino'},{v:'x',l:'X (scartato)'}],value:x&&x.trash?'x':'mag'},
    {id:'events',label:'Km per evento',type:'textarea',full:true,value:x?evs(x).map(e=>e.ev+' '+e.km).join('\n'):'',ph:'20260901_OT_VLC 136\n20260112_PT_EST 62',hint:'Un evento per riga: nome evento e km. I km totali sono la somma.'},
    {type:'sep',label:'FIA code (facoltativi)'},
    ...WHEELS.map(w=>({id:w[0],label:w[1],value:x?.[w[0]],scan:true})),
    {id:'notes',label:'Note',full:true,value:x?.notes}],
    danger:x?{label:'Elimina set',run:()=>confirmBox('Eliminare il set '+esc(x.label)+'?','Il set viene tolto dal magazzino.','Elimina',()=>run(async()=>{await del('tires',x.id);toast('Set eliminato')}))}:null,
    onSubmit:v=>run(async()=>{
      for(const w of WHEELS){const code=norm(v[w[0]]);if(!code)continue;
        const dup=S.tires.find(y=>(!x||y.id!==x.id)&&WHEELS.some(z=>norm(y[z[0]])===code));
        if(dup)throw new Error('Il FIA code '+v[w[0]]+' è già nel set '+dup.label+'.');
        if(WHEELS.filter(z=>norm(v[z[0]])===code).length>1)throw new Error('Il FIA code '+v[w[0]]+' è inserito due volte.')}
      if(S.tires.some(y=>(!x||y.id!==x.id)&&norm(y.label)===norm(v.label)))throw new Error('Esiste già un set '+v.label+'.');
      const events=parseEvents(v.events);
      const d={label:v.label,compound:v.compound,trash:v.status==='x',status:events.some(e=>e.km>0)?'usato':'nuovo',events,km:events.reduce((a,e)=>a+num(e.km),0),notes:v.notes};
      WHEELS.forEach(w=>d[w[0]]=v[w[0]]||'');
      if(x)await upd('tires',x.id,d);else await add('tires',d);toast(x?'Set aggiornato':'Set aggiunto')})});
}
function tireEventForm(x){
  openForm({title:'Evento · set '+x.label,intro:'Km attuali: '+fmt(tKm(x)),fields:[{id:'ev',label:'Evento',required:true,ph:'20261012_PT_MUG'},{id:'km',label:'Km',type:'number',required:true}],submit:'Aggiungi',
    onSubmit:v=>run(async()=>{const km=num(v.km);if(km<=0)throw new Error('Inserisci i km.');const events=[...evs(x),{ev:v.ev,km}];
      await upd('tires',x.id,{events,km:events.reduce((a,e)=>a+num(e.km),0),status:'usato'});toast(fmt(km)+' km aggiunti a '+x.label)})});
}

/* ===== IMPOSTAZIONI ===== */

  return `<div class="sechead"><h2 class="sec">Impostazioni</h2></div>
  <div class="panel" style="padding:16px;display:grid;gap:14px">
    <h3 class="sub">Limiti km</h3>
    <div class="tblwrap"><table><thead><tr><th></th><th class="num">Revisione ogni</th><th class="num">Vita massima</th></tr></thead><tbody>
      <tr><td><b>Motore</b></td><td class="num">${num(c.engRevKm)?fmt(c.engRevKm)+' km':'—'}</td><td class="num">${num(c.engLifeKm)?fmt(c.engLifeKm)+' km':'—'}</td></tr>
      </tbody></table></div>
    <div class="tblwrap"><table><thead><tr><th></th><th class="num">Km performance</th><th class="num">Da cambiare a</th></tr></thead><tbody><tr><td><b>Turbo</b></td><td class="num">${num(c.turPerfKm)?fmt(c.turPerfKm)+' km':'—'}</td><td class="num">${num(c.turLifeKm)?fmt(c.turLifeKm)+' km':'—'}</td></tr></tbody></table></div>
    <p class="muted" style="margin:0">Motore: giallo al ${fmt(c.warnPct||80)}% del limite, rosso al 100%. Turbo: giallo oltre i km di performance, rosso ai km di cambio. I turbo non hanno revisione.</p>
    ${W()?`<div><button class="btn" data-act="editLimits">Modifica limiti</button></div>`:''}
  </div>
  <div class="panel" style="padding:16px;display:grid;gap:12px">
    <h3 class="sub">Piloti / vetture</h3>
    <p class="muted" style="margin:0">Compaiono come suggerimenti nel campo Pilota quando aggiungi un evento a un motore.</p>
    <div class="btns">${pilots().length?pilots().map(p=>`<span class="chip plain" style="font-size:12px;text-transform:none;letter-spacing:0">${esc(p)}</span>`).join(''):'<span class="muted">Nessun pilota inserito.</span>'}</div>
    ${W()?`<div><button class="btn" data-act="editPilots">Modifica elenco</button></div>`:''}
  </div>
  <div class="panel" style="padding:16px;display:grid;gap:8px">
    <h3 class="sub">Accesso</h3>
    <p class="muted" style="margin:0">Chiunque abbia il link può vedere e modificare il magazzino. I dati sono condivisi e si aggiornano in tempo reale su tutti i telefoni.</p>
  </div>
  <div class="panel" style="padding:16px;display:grid;gap:8px">
    <h3 class="sub">Backup</h3>
    <p class="muted" style="margin:0">Scarica una copia di tutti i dati, oppure carica un file di backup (per esempio <span class="mono">dati-iniziali.json</span>). Il caricamento sovrascrive i documenti con lo stesso codice e non cancella gli altri.</p>
    <div class="btns"><button class="btn" data-act="exportData">Scarica backup</button>${W()?`<button class="btn" data-act="importData">Carica backup</button>`:''}</div>
    <input type="file" id="impFile" accept="application/json,.json" hidden>
  </div>`;
}
function limitsForm(){
  const c=S.cfg;
  openForm({title:'Limiti km',fields:[{type:'sep',label:'Motore'},{id:'engRevKm',label:'Revisione ogni (km)',type:'number',value:c.engRevKm||''},{id:'engLifeKm',label:'Vita massima (km)',type:'number',value:c.engLifeKm||''},
    {type:'sep',label:'Turbo'},{id:'turPerfKm',label:'Km suggeriti per la performance',type:'number',value:c.turPerfKm||''},{id:'turLifeKm',label:'Da cambiare a (km)',type:'number',value:c.turLifeKm||''},
    {type:'sep',label:'Avvisi motore'},{id:'warnPct',label:'Avviso giallo al (% del limite)',type:'number',value:c.warnPct||80}],
    onSubmit:v=>run(async()=>{await saveCfg({engRevKm:num(v.engRevKm),engLifeKm:num(v.engLifeKm),turPerfKm:num(v.turPerfKm),turLifeKm:num(v.turLifeKm),warnPct:Math.min(99,Math.max(10,num(v.warnPct)||80))});toast('Limiti aggiornati')})});
}
function pilotsForm(){
  openForm({title:'Piloti / vetture',intro:'Uno per riga.',
    fields:[{id:'list',label:'Elenco',type:'textarea',full:true,value:pilots().join('\n'),ph:'G. Zasov\nT. Stolcermanis'}],
    onSubmit:v=>run(async()=>{
      const old=pilots(),nw=[...new Set(v.list.split(/\r?\n/).map(x=>x.trim()).filter(Boolean))];
      for(let i=0;i<old.length;i++){const o=old[i],n=nw[i];if(n&&!nw.includes(o)&&!old.includes(n)){
        for(const x of S.tires.filter(x=>x.pilot===o))await upd('tires',x.id,{pilot:n});
        for(const x of S.eng.filter(x=>x.pilot===o))await upd('eng',x.id,{pilot:n});
        if(S.pil===o){S.pil=n;store.set('mg_pil',n)}}}
      await saveCfg({pilots:nw});toast('Elenco aggiornato')})});
}

/* ---------- azioni ---------- */
const ACT={
  newEng:()=>engForm(),editEng:id=>engForm(engById(id)),newTur:()=>turForm(),editTur:id=>turForm(turById(id)),
  engEvent:id=>engEventForm(engById(id)),swapTurbo:id=>swapTurboForm(engById(id)),pairTurbo:id=>pairTurboForm(turById(id)),
  engRevDone:id=>revForm(engById(id),'eng'),
  toRev:id=>{const e=engById(id),t=turById(e.turboId);confirmBox('Mandare in revisione il motore '+esc(e.serial)+'?',t?'Il turbo '+esc(t.serial)+' resta accoppiato: se va in revisione anche lui, cambialo da "Cambia turbo" o dal suo stato.':'Il motore passa allo stato "In revisione".','In revisione',()=>run(async()=>{await upd('eng',id,{status:'revisione',log:logPush(e,'Inviato in revisione a '+fmt(kmTot(e))+' km')});toast('Motore in revisione')}))},
  logEng:id=>logBox(engById(id),'eng'),logTur:id=>logBox(turById(id),'tur'),
  newTire:()=>tireForm(),editTire:id=>tireForm(S.tires.find(x=>x.id===id)),tireEvent:id=>tireEventForm(S.tires.find(x=>x.id===id)),tireOpen:id=>tireDetail(S.tires.find(x=>x.id===id)),
  tireDel:id=>{const x=S.tires.find(y=>y.id===id);if(x)confirmBox('Eliminare il set '+esc(x.label)+'?','Il set viene tolto dal magazzino.','Elimina',()=>run(async()=>{await del('tires',x.id);toast('Set eliminato')}))},
  tireTrash:id=>{const x=S.tires.find(y=>y.id===id);run(async()=>{await upd('tires',id,{trash:!x.trash});toast(x.trash?x.label+' rimesso in magazzino':x.label+' segnato X')})},
  goSettings:()=>setTab('impostazioni'),
  exportData:()=>{const pick=a=>Object.fromEntries(a.map(({id,...d})=>[id,d]));
    const out={app:'magazzino-motori-gomme',exported:today(),eng:pick(S.eng),tur:pick(S.tur),tires:pick(S.tires),config:{main:S.cfg}};
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'}));a.download='magazzino-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove()},
  seedData:()=>run(async()=>{const r=await fetch('dati-iniziali.json',{cache:'no-store'});if(!r.ok)throw new Error('File dati-iniziali.json non trovato sul sito.');const d=await r.json();
    let b=S.db.batch(),k=0;for(const c of ['eng','tur','tires'])for(const [id,doc] of Object.entries(d[c]||{})){b.set(S.db.collection(c).doc(id),doc);k++}
    if(d.config&&d.config.main){b.set(S.db.doc('config/main'),{...DEF,...d.config.main});k++}
    await b.commit();toast('Dati iniziali caricati')}),
  importData:()=>{const f=$('#impFile');f.value='';f.onchange=()=>{const file=f.files[0];if(!file)return;
    file.text().then(t=>{let d;try{d=JSON.parse(t)}catch(e){toast('File non valido');return}
      const n=['eng','tur','tires'].reduce((a,c)=>a+Object.keys(d[c]||{}).length,0);
      if(!n&&!d.config){toast('Il file non contiene dati del magazzino');return}
      confirmBox('Caricare il backup?',n+' documenti tra motori, turbo e gomme. Quelli con lo stesso codice vengono sovrascritti.','Carica',()=>run(async()=>{
        let b=S.db.batch(),k=0;const flush=async()=>{if(k){await b.commit();b=S.db.batch();k=0}};
        for(const c of ['eng','tur','tires'])for(const [id,doc] of Object.entries(d[c]||{})){b.set(S.db.collection(c).doc(id),doc);if(++k>=400)await flush()}
        if(d.config&&d.config.main)b.set(S.db.doc('config/main'),{...DEF,...d.config.main}),k++;
        await flush();toast('Backup caricato')}))})};f.click()},editLimits:limitsForm,editPilots:pilotsForm,
};
$('#main').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f)f(b.dataset.id)});
$('#main').addEventListener('change',e=>{const f=e.target.dataset.filter;if(!f)return;
  if(f==='old')S.showOld=e.target.checked;
  render()});
$('#main').addEventListener('input',e=>{if(!e.target.dataset.search)return;S.q=e.target.value;const l=$('#tireList');if(l)l.innerHTML=tireRows()});

/* ---------- avvio ---------- */
trObs.observe(document.body,{childList:true,subtree:true,characterData:true});
render();applyLang();
function boot(){
  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase){S.blocked='Non riesco a caricare Firebase: controlla la connessione e ricarica.';render();return}
  if(!cfg||!cfg.apiKey||/INCOLLA/.test(cfg.apiKey)){S.blocked='Manca la configurazione Firebase: incolla i tuoi dati nel file config.js (vedi LEGGIMI).';$('#status').textContent='';render();return}
  firebase.initializeApp(cfg);
  const db=firebase.firestore();
  try{db.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  S.db=db;
  const got=new Set(),N=4;
  const mark=k=>{got.add(k);if(got.size>=N){S.live=true;$('#status').textContent=navigator.onLine?'Aggiornato in tempo reale':'Offline · le modifiche partono appena torna la rete'}render()};
  const fail=err=>{if(err&&err.code==='permission-denied'){S.blocked='Il database rifiuta l’accesso: controlla le regole di Firestore (vedi LEGGIMI).';S.db=null;render()}else $('#status').textContent='Connessione interrotta, ricarica la pagina'};
  for(const n of ['eng','tur','tires'])db.collection(n).onSnapshot(s=>{S[n]=s.docs.map(d=>({id:d.id,...d.data()}));mark(n)},fail);
  db.doc('config/main').onSnapshot(s=>{S.cfg=s.exists?{...DEF,...s.data()}:{...DEF};mark('cfg')},fail);
  addEventListener('online',()=>{if(S.live)$('#status').textContent='Aggiornato in tempo reale'});
  addEventListener('offline',()=>{$('#status').textContent='Offline · le modifiche partono appena torna la rete'});
}
boot();
})();
